<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE7DA"/>
      <stop offset="1" stop-color="#E2D6C4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.462" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1A1713" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#1A1713" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="82"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="600" height="720" fill="url(#bg)"/>
  <rect width="600" height="720" fill="url(#glow)"/>
  <ellipse cx="300" cy="583" rx="210" ry="46" fill="url(#shadow)"/>
  <g transform="translate(300 380) rotate(-7.67) scale(1.16) translate(-300 -380)">
    
        <rect x="186" y="404" width="150" height="150" rx="10" fill="#C8A882"/>
        <rect x="336" y="404" width="110" height="150" rx="10" fill="#A98862"/>
        <rect x="236" y="254" width="150" height="150" rx="10" fill="#7E5A3C" opacity="0.8"/>
        <circle cx="311" cy="200" r="54" fill="#C8A882"/>
  </g>
  <rect width="600" height="720" filter="url(#grain)" opacity="0.6"/>
</svg>
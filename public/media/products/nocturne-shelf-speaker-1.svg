<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E2DE"/>
      <stop offset="1" stop-color="#D2CFC9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.657" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1A1713" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#1A1713" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="62"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="600" height="720" fill="url(#bg)"/>
  <rect width="600" height="720" fill="url(#glow)"/>
  <ellipse cx="300" cy="585" rx="210" ry="46" fill="url(#shadow)"/>
  <g transform="translate(300 380) rotate(7.45) scale(1.16) translate(-300 -380)">
    
        <rect x="216" y="190" width="168" height="380" rx="20" fill="#2A2724"/>
        <rect x="300" y="190" width="84" height="380" rx="20" fill="#191714" opacity="0.3"/>
        <circle cx="300" cy="300" r="52" fill="#0E0D0B" opacity="0.75"/>
        <circle cx="300" cy="300" r="22" fill="#E4E2DE" opacity="0.6"/>
        <circle cx="300" cy="460" r="34" fill="#0E0D0B" opacity="0.5"/>
  </g>
  <rect width="600" height="720" filter="url(#grain)" opacity="0.6"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6E8E9"/>
      <stop offset="1" stop-color="#D4D8DA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.331" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1A1713" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#1A1713" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="92"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="600" height="720" fill="url(#bg)"/>
  <rect width="600" height="720" fill="url(#glow)"/>
  <ellipse cx="300" cy="574" rx="210" ry="46" fill="url(#shadow)"/>
  <g transform="translate(300 380) rotate(5.83) scale(1.16) translate(-300 -380)">
    
        <rect x="205" y="160" width="190" height="400" rx="26" fill="#333A3E"/>
        <rect x="216" y="172" width="168" height="376" rx="20" fill="#4A5257"/>
        <rect x="232" y="196" width="136" height="300" rx="4" fill="#E6E8E9" opacity="0.75"/>
        <rect x="272" y="176" width="56" height="9" rx="4" fill="#20262A"/>
        <circle cx="300" cy="524" r="14" fill="#20262A" opacity="0.7"/>
  </g>
  <rect width="600" height="720" filter="url(#grain)" opacity="0.6"/>
</svg>
        <path d="M252 200 L348 200 Q356 260 386 330 Q412 396 386 470 Q360 544 300 544 Q240 544 214 470 Q188 396 214 330 Q244 260 252 200 Z" fill="#B5654A"/>
        <path d="M300 200 L348 200 Q356 260 386 330 Q412 396 386 470 Q360 544 300 544 Z" fill="#8E4A33" opacity="0.3"/>
        <ellipse cx="300" cy="200" rx="48" ry="12" fill="#5E2E1E"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAE8E4"/>
      <stop offset="1" stop-color="#DAD7D1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.558" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1A1713" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#1A1713" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="59"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="600" height="720" fill="url(#bg)"/>
  <rect width="600" height="720" fill="url(#glow)"/>
  <ellipse cx="300" cy="576" rx="210" ry="46" fill="url(#shadow)"/>
  <g transform="translate(300 380) rotate(1.96) scale(1.16) translate(-300 -380)">
    
        <rect x="132" y="290" width="336" height="140" rx="22" fill="#9A958C"/>
        <rect x="132" y="290" width="336" height="60" rx="22" fill="#7C776E" opacity="0.28"/>
        <rect x="112" y="330" width="56" height="150" rx="20" fill="#7C776E"/>
        <rect x="432" y="330" width="56" height="150" rx="20" fill="#7C776E"/>
        <rect x="168" y="400" width="264" height="80" rx="14" fill="#4E4A44" opacity="0.55"/>
        <rect x="160" y="480" width="16" height="50" fill="#4E4A44"/>
        <rect x="424" y="480" width="16" height="50" fill="#4E4A44"/>
  </g>
  <rect width="600" height="720" filter="url(#grain)" opacity="0.6"/>
</svg>